# The gate: formatting, lint, typecheck and test, on every pull request and
# every push to main, then a release of what landed on main (PRD §8).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Each action is pinned to the commit of its release, which a tag can't be
# moved away from, with the release named beside it.

# Read-only unless a job says otherwise: only the release writes.
permissions:
  contents: read

# A pull request pushed to again stops its last run, which is now out of date,
# to save GitHub Actions minutes; main's runs each finish, as each may release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
          cache: pnpm
      # The Hub's tests probe and convert sample Media Files, which they make with ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # A merge into main, once it passes the gate, is released by semantic-release
  # (see .releaserc.json): the next version from the Conventional Commits since
  # the last `v*` tag, CHANGELOG.md, every package.json set to that version in
  # a `chore(release)` commit, the tag, and a GitHub release.
  release:
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two merges in quick succession release one after the other, never at once,
    # so they never both claim the same version.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit and tag, for semantic-release to find the last release.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
