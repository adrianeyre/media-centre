    <link rel="stylesheet" href="/src/style.css" />
    <!--
      How this Remote looks (src/appearance.ts), taken on before the page is
      first drawn, so it never shows the default look first.
    -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem("media-centre:appearance") || "null") || {};
        if (saved.mode === "light" || saved.mode === "dark") document.documentElement.dataset.mode = saved.mode;
        if (typeof saved.theme === "string") document.documentElement.dataset.theme = saved.theme;
      } catch {
        // Storage refused, or unreadable: the default look.
      }
    </script>
